name: Validate source and browser JS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate project JSON
        shell: pwsh
        run: |
          $project = Get-Content CacilendUE.uproject -Raw | ConvertFrom-Json
          if ($project.EngineAssociation -ne "5.8") { throw "Expected Unreal Engine 5.8 association." }
          Write-Host "uproject JSON valid."
      - name: Validate Python syntax
        shell: pwsh
        run: |
          python -m py_compile Scripts/generate_textures.py Scripts/extract_cod2_assets.py Scripts/list_cod2_assets.py Scripts/blender_export_selected_fbx.py Scripts/validate_cpp_braces.py Content/Python/Setup_Cacilend.py Content/Python/Import_Cacilend_Assets.py Content/Python/Setup_Google3DTiles_Cesium.py
          Write-Host "Python syntax valid."
      - name: Static C++ delimiter sanity
        shell: pwsh
        run: |
          python Scripts/validate_cpp_braces.py
      - name: Validate browser JavaScript syntax
        shell: pwsh
        run: |
          node --check browser/src/main.js
          Write-Host "Browser JavaScript syntax valid."
      - name: Create source archive
        shell: pwsh
        run: |
          Compress-Archive -Path * -DestinationPath "$env:RUNNER_TEMP\CacilendUE-Source.zip" -Force
          Copy-Item "$env:RUNNER_TEMP\CacilendUE-Source.zip" "CacilendUE-Source.zip" -Force
      - name: Create UE5-only Windows source archive
        shell: pwsh
        run: |
          $candidates = @(
            "CacilendUE.uproject", ".gitignore", "Config", "Source", "Content",
            "Scripts", "Docs", "SourceArt", "Archive",
            "Start_Cacilend_Editor.bat", "Setup_Cacilend_Assets.bat",
            "Import_Cacilend_Assets.bat", "Extract_COD2_Assets.bat",
            "Install_COD2_Blender_Importer.bat", "Convert_COD2_Animations.bat", "Download_CC0_Weapon_Fallback.bat", "Build_Run_Cacilend_UE5.bat",
            "Package_Windows.bat", "README.md", "README_SR.md", "START_HERE_SR.txt",
            "ASSET_NOTES_SR.txt", "VALIDATION_REPORT_SR.txt"
          )
          $paths = $candidates | Where-Object { Test-Path $_ }
          Compress-Archive -Path $paths -DestinationPath "$env:RUNNER_TEMP\CacilendUE-Windows-Source.zip" -Force
          Copy-Item "$env:RUNNER_TEMP\CacilendUE-Windows-Source.zip" "CacilendUE-Windows-Source.zip" -Force
      - name: Upload UE5-only Windows project
        uses: actions/upload-artifact@v4
        with:
          name: CacilendUE-Windows-Source
          path: CacilendUE-Windows-Source.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: CacilendUE-Source
          path: CacilendUE-Source.zip
          if-no-files-found: error
          retention-days: 14
